<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CSUCampusCraft 用户端</title>
    <style>
        body { margin: 0; color: #1c312a; background: #f5f8f4; font: 1rem/1.6 system-ui, sans-serif; }
        main { max-width: 44rem; margin: 3rem auto; padding: 0 1.25rem; }
        h1 { margin-block: .25rem; }
        section { margin-top: 1.75rem; padding: 1rem 1.5rem; border: 1px solid #d3dfd2; background: white; }
        section h2 { margin-top: 0; }
    </style>
</head>
<body data-csucampuscraft-app="user">
<main>
    <header>
        <small>校园文创商城 · 工程初始化</small>
        <h1>CSUCampusCraft 用户端</h1>
        <p>面向购买者的校园文创商城。当前展示共享商品分类中的一级主题。</p>
    </header>
    <section aria-labelledby="themes-heading">
        <h2 id="themes-heading">校园主题</h2>
        <p th:attr="data-theme-count=${#lists.size(themes)}">
            共 <span th:text="${#lists.size(themes)}">0</span> 个一级主题
        </p>
        <p th:if="${#lists.isEmpty(themes)}">暂无主题。请确认演示数据已导入。</p>
        <ul th:unless="${#lists.isEmpty(themes)}">
            <li th:each="theme : ${themes}" th:attr="data-theme-code=${theme.code}" th:text="${theme.name}"></li>
        </ul>
    </section>
</main>
</body>
</html>
