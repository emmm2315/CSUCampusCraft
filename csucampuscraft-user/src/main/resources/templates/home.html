<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('CSUCampusCraft 用户端', ~{::mainContent})}">
<head><title>CSUCampusCraft 用户端</title></head>
<body>
<div th:fragment="mainContent">
    <header class="page-heading">
        <small class="eyebrow">校园文创商城 · 工程初始化</small>
        <h1>CSUCampusCraft 用户端</h1>
        <p class="muted">面向购买者的校园文创商城。当前展示共享商品分类中的一级主题。</p>
    </header>
    <section class="panel" aria-labelledby="themes-heading">
        <h2 id="themes-heading">校园主题</h2>
        <p class="muted" th:attr="data-theme-count=${#lists.size(themes)}">
            共 <span th:text="${#lists.size(themes)}">0</span> 个一级主题
        </p>
        <p class="empty-state" th:if="${#lists.isEmpty(themes)}">暂无主题。请确认演示数据已导入。</p>
        <ul class="theme-list" th:unless="${#lists.isEmpty(themes)}">
            <li th:each="theme : ${themes}" th:attr="data-theme-code=${theme.code}" th:text="${theme.name}"></li>
        </ul>
    </section>
</div>
</body>
</html>
