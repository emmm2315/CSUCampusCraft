<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(${product.name + ' · CSUCampusCraft'}, ~{::mainContent})}">
<head><title>商品详情</title></head>
<body>
<div th:fragment="mainContent" class="catalog-detail-page" data-page-id="U03"
     th:attr="data-product-id=${product.id},data-product-sku=${product.sku},data-price=${product.price},data-stock=${product.stock},data-gallery-count=${#lists.size(images)}">
    <nav class="catalog-breadcrumb" aria-label="当前位置">
        <a th:href="@{/}">首页</a><span aria-hidden="true">/</span>
        <a th:href="@{/products}">商品</a><span aria-hidden="true">/</span>
        <a th:href="@{/products(categoryId=${theme.id},type='ALL',q='',sort='DEFAULT',page=1,size=6)}" th:text="${theme.name}">一级主题</a>
        <span aria-hidden="true">/</span><span th:text="${category.name}">二级分类</span>
        <span aria-hidden="true">/</span><span aria-current="page" th:text="${product.name}">商品名称</span>
    </nav>

    <th:block th:replace="~{fragments/alerts :: summary(${errorAnchors})}"></th:block>
    <p th:if="${globalError != null}" class="cart-reload-help">
        <a th:href="${reloadUrl ?: '/cart'}">重新载入当前页面</a>
        <span class="muted">请核对当前商品与购物车，再重新提交。</span>
    </p>

    <section class="catalog-detail-main" aria-labelledby="product-heading">
        <figure class="catalog-cover" data-cover-image>
            <th:block th:replace="~{fragments/images :: image(${product.coverImage},${product.name})}"></th:block>
        </figure>
        <div class="catalog-detail-info">
            <p class="eyebrow" th:text="${theme.name + ' / ' + category.name}">校园文创</p>
            <h1 id="product-heading" th:text="${product.name}">商品名称</h1>
            <p class="muted catalog-sku">SKU：<span th:text="${product.sku}">SKU</span></p>
            <p class="catalog-detail-summary muted" th:if="${!#strings.isEmpty(product.summary)}" th:text="${product.summary}">商品简介</p>
            <p class="product-price detail-price" th:text="${'¥' + #numbers.formatDecimal(product.price,1,'NONE',2,'POINT')}">¥0.00</p>
            <p class="stock-badge" th:classappend="${product.stock == 0 ? 'stock-sold-out' : ''}"
               th:text="${product.stock == 0 ? '售罄 · 库存 0' : '现货 · 库存 ' + product.stock}">库存</p>
            <section class="catalog-purchase" aria-labelledby="purchase-heading">
                <h2 id="purchase-heading">选购</h2>
                <form th:if="${currentUser != null}" method="post" th:action="@{/cart/items}" data-submit-state data-add-to-cart>
                    <th:block th:replace="~{fragments/fields :: csrf}"></th:block>
                    <input type="hidden" name="productId" th:value="${product.id}">
                    <fieldset class="cart-form-controls" th:disabled="${product.stock == 0 or cartConflict == true}">
                        <div class="form-field" th:with="hasError=${fieldErrors != null and fieldErrors.containsKey('quantity')}">
                            <label for="purchase-quantity">数量</label>
                            <input id="purchase-quantity" type="number" name="quantity" min="1" th:max="${product.stock > 0 and product.stock < 99 ? product.stock : 99}" step="1" required
                                   th:value="${quantityInput != null ? quantityInput : '1'}" th:classappend="${hasError ? 'input-error' : ''}"
                                   th:attr="aria-invalid=${hasError},aria-describedby=${hasError ? 'purchase-quantity-error purchase-help' : 'purchase-help'}">
                            <p th:if="${hasError}" id="purchase-quantity-error" class="field-error" th:text="${fieldErrors.get('quantity')}">请检查数量。</p>
                        </div>
                        <button type="submit" aria-describedby="purchase-help">加入购物车</button>
                    </fieldset>
                </form>
                <div th:if="${currentUser == null}" class="catalog-guest-purchase">
                    <a th:if="${product.stock > 0}" class="button" th:href="@{/login(returnUrl=${'/products/' + product.id})}">登录后加购</a>
                    <button th:if="${product.stock == 0}" type="button" disabled aria-describedby="purchase-help">加入购物车</button>
                </div>
                <p id="purchase-help" class="field-help"
                   th:text="${product.stock == 0 ? '当前商品已售罄，暂时无法加购。' : cartConflict == true ? '商品或购物车发生变化，请先重新载入并核对。' : currentUser == null ? '请先登录，返回此商品详情后再选择数量并加购。' : '每种商品最多 99 件，整车最多 20 种。加购不预留库存，以提交时库存为准。'}">加购说明</p>
            </section>
        </div>
    </section>

    <section class="panel catalog-section catalog-description" aria-labelledby="description-heading">
        <h2 id="description-heading">设计说明</h2>
        <p class="catalog-plain-text" th:if="${!#strings.isEmpty(product.description)}" th:text="${product.description}">商品设计说明</p>
        <p class="muted" th:if="${#strings.isEmpty(product.description)}">暂无设计说明。</p>
    </section>

    <section class="catalog-section" aria-labelledby="gallery-heading">
        <div class="section-heading">
            <div><h2 id="gallery-heading">商品相册</h2><p class="muted">共 <span th:text="${#lists.size(images)}">0</span> 张图片</p></div>
        </div>
        <p class="empty-state" th:if="${#lists.isEmpty(images)}" data-gallery-empty>暂无相册，当前显示商品封面。</p>
        <div class="catalog-gallery" data-product-gallery>
            <figure th:each="imageItem : ${images}"
                    th:attr="data-image-id=${imageItem.id},data-image-sort=${imageItem.sortOrder}">
                <th:block th:replace="~{fragments/images :: image(${imageItem.imagePath},${imageItem.altText ?: product.name})}"></th:block>
                <figcaption class="muted" th:text="${imageItem.altText ?: product.name}">商品图片</figcaption>
            </figure>
        </div>
    </section>
</div>
</body>
</html>
