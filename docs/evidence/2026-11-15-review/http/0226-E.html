<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>新建商品 · CSUCampusCraft</title>
    <link rel="stylesheet" href="/css/app.css">
    <script defer src="/js/app.js"></script>
</head>
<body data-csucampuscraft-app="admin" data-authenticated="true">
<a class="skip-link" href="#main-content">跳到主要内容</a>
<header class="site-header">
    <div class="container site-header-inner">
        <a class="site-brand" href="/" aria-label="CSUCampusCraft 首页">
            <span class="brand-mark" aria-hidden="true">CSU</span>
            <span>CSUCampusCraft 管理端</span>
        </a>
        <nav class="site-nav" aria-label="站点导航">
            <a href="/">首页</a>
            <a href="/categories">分类管理</a>
            <a href="/products">商品管理</a>
            <a href="/orders" data-admin-orders-link>订单管理</a>
            <a href="/customers" data-admin-customers-link>顾客管理</a>
            <span class="app-label">管理端</span>
            

            
            <span class="app-label" data-current-user>商城管理员</span>
            <form method="post" action="/logout" data-submit-state>
                <input type="hidden" name="_csrf" value="[REDACTED]">
                <button type="submit" class="button-secondary">退出</button>
            </form>
        </nav>
    </div>
</header>
<div class="container global-alerts" aria-label="全局提示区">
    
    
    

</div>
<main id="main-content" class="container main-content" tabindex="-1">
    <div data-page-id="A05" data-version="0">
    <header class="page-heading admin-toolbar">
        <div><p class="eyebrow">商品资料</p><h1>新建商品</h1>
            <p class="muted">新商品先保存为草稿，检查后再上架。</p></div>
        <div class="button-row">
            <a class="button button-secondary" href="/products">返回商品列表</a>
            
            
        </div>
    </header>
    
    
    <section class="panel">
        <form method="post" action="/products" data-submit-state data-product-form>
            <input type="hidden" name="_csrf" value="[REDACTED]">
            <input type="hidden" name="returnUrl" value="/products">
            
            
            <div class="form-grid">
                <div class="form-field">
    <label for="sku">SKU</label>
    <input type="text" id="sku" name="sku" value=""
           aria-invalid="false">
    
</div>
                
                <div class="form-field">
                    <label for="categoryId">二级分类</label>
                    <select id="categoryId" name="categoryId" aria-invalid="false">
                        <option value="">请选择二级分类</option>
                        <option value="101">校园地标 / 文具</option>
                        <option value="102">校园地标 / 纪念周边</option>
                        <option value="201">学院风采 / 文具</option>
                        <option value="202">学院风采 / 纪念周边</option>
                        <option value="301">社团活动 / 文具</option>
                        <option value="302">社团活动 / 纪念周边</option>
                        <option value="401">校园运动 / 文具</option>
                        <option value="402">校园运动 / 纪念周边</option>
                        <option value="501">毕业纪念 / 文具</option>
                        <option value="502">毕业纪念 / 纪念周边</option>
                    </select>
                    
                </div>
                <div class="form-field">
    <label for="name">商品名称</label>
    <input type="text" id="name" name="name" value=""
           aria-invalid="false">
    
</div>
                <div class="form-field">
    <label for="price">售价（元）</label>
    <input type="text" id="price" name="price" value=""
           aria-invalid="false">
    
</div>
                <div class="form-field">
    <label for="stock">初始库存</label>
    <input type="number" id="stock" name="stock" value="0"
           min="0" max="2147483647" step="1"
           aria-invalid="false">
    
</div>
                
                <div class="form-field">
    <label for="sortOrder">排序值</label>
    <input type="number" id="sortOrder" name="sortOrder" value="0"
           min="0" max="2147483647" step="1"
           aria-invalid="false">
    
</div>
            </div>
            <p class="field-help">SKU 最多 40 个字符，名称最多 120 个字符。售价为 0.01–9,999,999,999.99 元，最多两位小数。</p>
            <div class="form-field">
                <label for="summary">商品摘要</label>
                <textarea id="summary" name="summary" rows="3" aria-invalid="false" aria-describedby="summary-help"></textarea>
                <p id="summary-help" class="field-help">可选，最多 500 个字符。</p>
                
            </div>
            <div class="form-field">
                <label for="description">设计说明</label>
                <textarea id="description" name="description" rows="6" aria-invalid="false" aria-describedby="description-help"></textarea>
                <p id="description-help" class="field-help">可选，按普通文本保存；内容总量最多 65,535 字节。</p>
                
            </div>
            <div class="form-field">
    <label for="coverImage">封面路径</label>
    <input type="text" id="coverImage" name="coverImage" value=""
           aria-invalid="false">
    
</div>
            <p class="field-help">可留空。填写时使用 images/ 下的站内相对路径，最多 255 个字符。</p>
            <div class="button-row">
                <button type="submit">保存草稿</button>
                <a class="button button-secondary" href="/products">取消</a>
            </div>
        </form>
    </section>
    
    
</div>
</main>
<footer class="site-footer">
    <div class="container">
        <span>CSUCampusCraft 校园文创商城</span>
        <span class="muted">课程实验 · 教学模拟</span>
    </div>
</footer>
</body>
</html>
