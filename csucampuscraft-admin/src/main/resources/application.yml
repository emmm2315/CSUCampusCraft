server:
  error:
    include-exception: false
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  port: 8081
  servlet:
    session:
      cookie:
        name: CSUCAMPUSCRAFT_ADMIN_SESSION

spring:
  application:
    name: csucampuscraft-admin
  datasource:
    url: "${CSUCAMPUSCRAFT_DB_URL:jdbc:mysql://127.0.0.1:3306/csucampuscraft}"
    username: "${CSUCAMPUSCRAFT_DB_USER:csucampuscraft}"
    password: "${CSUCAMPUSCRAFT_DB_PASSWORD:}"
    hikari:
      data-source-properties:
        connectionTimeZone: "+00:00"
        forceConnectionTimeZoneToSession: "true"
  sql:
    init:
      mode: never
