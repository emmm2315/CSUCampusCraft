<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page('顾客状态操作提示 · CSUCampusCraft', ~{::mainContent})}">
<head><title>顾客状态操作提示</title></head><body>
<section th:fragment="mainContent" class="panel error-page ef-admin-page ef-error-page ef-form-section" data-page-id="A09" data-customer-action-conflict th:attr="data-error-status=${errorStatus},data-error-code=${errorCode}" aria-labelledby="customer-conflict-title"><p class="error-number ef-error-number ef-number" th:text="${errorStatus}">409</p><p class="ef-eyebrow" aria-hidden="true">CUSTOMER STATUS NOTICE</p><h1 id="customer-conflict-title" class="ef-page-title">未能更新顾客状态</h1><p th:text="${errorMessage}">请重新查看该顾客的当前状态，再决定是否操作。</p><p class="muted">请先核对实际启停状态；本页不显示成功结果。</p><p class="error-code ef-metadata">错误代码：<span th:text="${errorCode}">CUSTOMER_STATUS_CONFLICT</span></p><div class="button-row ef-actions"><a class="button ef-btn go" th:if="${userId != null}" th:href="@{/customers/{id}(id=${userId})}" data-return-customer>查看顾客详情</a><a class="button button-secondary ef-btn" th:href="@{/customers}" data-return-customers>返回顾客列表</a></div></section>
</body></html>
