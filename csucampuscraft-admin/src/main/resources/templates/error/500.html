<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('暂时无法完成请求', ~{::errorContent})}">
<head><title>暂时无法完成请求</title></head>
<body>
<section th:fragment="errorContent" class="panel error-page ef-admin-page ef-error-page ef-form-section" aria-labelledby="error-title" data-error-status="500">
    <p class="error-number ef-error-number ef-number">500</p>
    <p class="ef-eyebrow" aria-hidden="true">REQUEST UNAVAILABLE</p><h1 id="error-title" class="ef-page-title">暂时无法完成请求</h1>
    <p>服务暂时不可用，请稍后重试。</p>
    <p class="muted">请稍后重新访问，或回到首页。</p>
    <p class="error-code ef-metadata">错误代码：<span>INTERNAL_ERROR</span></p>

    <div class="button-row ef-actions"><a class="button ef-btn go" th:href="@{/}">返回首页</a></div>
</section>
</body>
</html>
