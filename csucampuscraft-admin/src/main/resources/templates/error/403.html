<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('请求未获允许', ~{::errorContent})}">
<head><title>请求未获允许</title></head>
<body>
<section th:fragment="errorContent" class="panel error-page ef-admin-page ef-error-page ef-form-section" aria-labelledby="error-title" data-error-status="403">
    <p class="error-number ef-error-number ef-number">403</p>
    <p class="ef-eyebrow" aria-hidden="true">REQUEST NOT ALLOWED</p><h1 id="error-title" class="ef-page-title">请求未获允许</h1>
    <p th:text="${errorMessage ?: '当前请求无法通过校验。'}">当前请求无法通过校验。</p>
    <p class="muted">请刷新页面后重新操作，或回到首页。</p>
    <p class="error-code ef-metadata">错误代码：<span th:text="${errorCode ?: 'FORBIDDEN'}">FORBIDDEN</span></p>

    <div class="button-row ef-actions"><a class="button ef-btn go" th:href="@{/}">返回首页</a></div>
</section>
</body>
</html>
