<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('页面未找到', ~{::errorContent})}">
<head><title>页面未找到</title></head>
<body>
<section th:fragment="errorContent" class="panel error-page" aria-labelledby="error-title" data-error-status="404">
    <p class="error-number">404</p>
    <h1 id="error-title">页面未找到</h1>
    <p th:text="${errorMessage ?: '没有找到你要访问的内容。'}">没有找到你要访问的内容。</p>
    <p class="muted">请检查地址，或回到首页继续浏览。</p>
    <p class="error-code">错误代码：<span th:text="${errorCode ?: 'NOT_FOUND'}">NOT_FOUND</span></p>

    <div class="button-row"><a class="button" th:href="@{/}">返回首页</a></div>
</section>
</body>
</html>
